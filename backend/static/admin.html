<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KORA Admin - Modération</title>
    <style>
        :root {
            --dark: #0A0A0A;
            --terra: #A65D47;
            --cream: #F5F0E6;
            --gray: #8E8E93;
            --gold: #C9A84C;
            --green: #46D369;
            --red: #FF6B6B;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Jost', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--dark);
            color: var(--cream);
            min-height: 100vh;
        }
        
        .header {
            background: linear-gradient(180deg, rgba(166,93,71,0.3) 0%, transparent 100%);
            padding: 20px 40px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--terra);
        }
        
        .logo span {
            color: var(--cream);
            font-size: 14px;
            font-weight: 400;
            margin-left: 10px;
        }
        
        .nav {
            display: flex;
            gap: 30px;
        }
        
        .nav a {
            color: var(--gray);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }
        
        .nav a:hover, .nav a.active {
            color: var(--cream);
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 24px;
        }
        
        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: var(--terra);
        }
        
        .stat-label {
            font-size: 14px;
            color: var(--gray);
            margin-top: 8px;
        }
        
        .section-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 24px;
            margin-bottom: 20px;
        }
        
        .pending-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .pending-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
        }
        
        .pending-thumbnail {
            width: 120px;
            height: 68px;
            background: linear-gradient(135deg, var(--terra), var(--dark));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        
        .pending-info {
            flex: 1;
        }
        
        .pending-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .pending-meta {
            font-size: 12px;
            color: var(--gray);
        }
        
        .pending-type {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .pending-type.video {
            background: rgba(166,93,71,0.2);
            color: var(--terra);
        }
        
        .pending-type.audio {
            background: rgba(201,168,76,0.2);
            color: var(--gold);
        }
        
        .pending-actions {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }
        
        .btn-approve {
            background: var(--green);
            color: var(--dark);
        }
        
        .btn-reject {
            background: transparent;
            border: 1px solid var(--red);
            color: var(--red);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }
        
        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            gap: 20px;
        }
        
        .login-box {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        
        .login-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 24px;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--gray);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: var(--cream);
            font-size: 16px;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--terra);
        }
        
        .btn-login {
            width: 100%;
            padding: 16px;
            background: var(--terra);
            color: var(--cream);
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(166,93,71,0.3);
        }
        
        .error {
            background: rgba(255,107,107,0.1);
            border: 1px solid var(--red);
            color: var(--red);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px;
            color: var(--gray);
        }
        
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        @media (max-width: 768px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .pending-item {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .pending-actions {
                width: 100%;
            }
            
            .pending-actions .btn {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">KORA <span>Admin</span></div>
        <nav class="nav" id="nav">
            <a href="#" class="active" data-section="moderation">Modération</a>
            <a href="#" data-section="content">Contenu</a>
            <a href="#" data-section="users">Utilisateurs</a>
            <a href="#" id="logout">Déconnexion</a>
        </nav>
    </header>
    
    <main class="container">
        <!-- Login Section -->
        <div id="login-section" class="login-container">
            <div class="login-box">
                <h2 class="login-title">Connexion Admin</h2>
                <div id="login-error" class="error" style="display: none;"></div>
                <form id="login-form">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" required placeholder="admin@kora.com">
                    </div>
                    <div class="form-group">
                        <label>Mot de passe</label>
                        <input type="password" id="password" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn-login">Se connecter</button>
                </form>
            </div>
        </div>
        
        <!-- Dashboard Section -->
        <div id="dashboard-section" style="display: none;">
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-value" id="stat-pending">0</div>
                    <div class="stat-label">En attente</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-published">0</div>
                    <div class="stat-label">Publiés</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-creators">0</div>
                    <div class="stat-label">Créateurs</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-users">0</div>
                    <div class="stat-label">Utilisateurs</div>
                </div>
            </div>
            
            <h2 class="section-title">🎬 Vidéos en attente d'approbation</h2>
            <div id="pending-list" class="pending-list">
                <div class="empty-state">
                    <div class="icon">✨</div>
                    <p>Aucune vidéo en attente</p>
                </div>
            </div>
        </div>
    </main>
    
    <script>
        const API_BASE = '/api';
        let authToken = localStorage.getItem('kora_admin_token');
        
        // Check auth on load
        if (authToken) {
            checkAuth();
        }
        
        // Login form
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await res.json();
                
                if (!res.ok) {
                    throw new Error(data.detail || 'Erreur de connexion');
                }
                
                authToken = data.token;
                localStorage.setItem('kora_admin_token', authToken);
                
                // Check if admin
                await checkAuth();
                
            } catch (err) {
                showError(err.message);
            }
        });
        
        // Logout
        document.getElementById('logout').addEventListener('click', () => {
            localStorage.removeItem('kora_admin_token');
            authToken = null;
            showLogin();
        });
        
        async function checkAuth() {
            try {
                const res = await fetch(`${API_BASE}/auth/profile`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                if (!res.ok) throw new Error('Non autorisé');
                
                const user = await res.json();
                
                if (!user.is_admin) {
                    showError('Accès administrateur requis');
                    localStorage.removeItem('kora_admin_token');
                    return;
                }
                
                showDashboard();
                loadPendingContent();
                
            } catch (err) {
                showLogin();
            }
        }
        
        function showLogin() {
            document.getElementById('login-section').style.display = 'flex';
            document.getElementById('dashboard-section').style.display = 'none';
        }
        
        function showDashboard() {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('dashboard-section').style.display = 'block';
        }
        
        function showError(msg) {
            const el = document.getElementById('login-error');
            el.textContent = msg;
            el.style.display = 'block';
        }
        
        async function loadPendingContent() {
            try {
                const res = await fetch(`${API_BASE}/content/admin/pending`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                if (!res.ok) throw new Error('Erreur de chargement');
                
                const data = await res.json();
                
                document.getElementById('stat-pending').textContent = data.total;
                
                const list = document.getElementById('pending-list');
                
                if (data.pending.length === 0) {
                    list.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">✨</div>
                            <p>Aucune vidéo en attente</p>
                        </div>
                    `;
                    return;
                }
                
                list.innerHTML = data.pending.map(item => `
                    <div class="pending-item" data-id="${item._id}">
                        <div class="pending-thumbnail">
                            ${item.type === 'video' ? '🎬' : '🎵'}
                        </div>
                        <div class="pending-info">
                            <div class="pending-title">${item.title}</div>
                            <div class="pending-meta">
                                <span class="pending-type ${item.type}">${item.type}</span>
                                • ${item.territory} • ${new Date(item.created_at).toLocaleDateString('fr-FR')}
                            </div>
                            <div class="pending-meta">${item.description || 'Pas de description'}</div>
                        </div>
                        <div class="pending-actions">
                            <button class="btn btn-approve" onclick="approveContent('${item._id}')">✓ Approuver</button>
                            <button class="btn btn-reject" onclick="rejectContent('${item._id}')">Rejeter</button>
                        </div>
                    </div>
                `).join('');
                
            } catch (err) {
                console.error('Error loading pending:', err);
            }
        }
        
        async function approveContent(id) {
            try {
                const res = await fetch(`${API_BASE}/content/admin/${id}/approve`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ notes: '' })
                });
                
                if (!res.ok) throw new Error('Erreur');
                
                // Reload list
                loadPendingContent();
                
            } catch (err) {
                alert('Erreur lors de l\'approbation');
            }
        }
        
        async function rejectContent(id) {
            const reason = prompt('Raison du rejet:');
            if (!reason) return;
            
            try {
                const res = await fetch(`${API_BASE}/content/admin/${id}/reject`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ reason })
                });
                
                if (!res.ok) throw new Error('Erreur');
                
                // Reload list
                loadPendingContent();
                
            } catch (err) {
                alert('Erreur lors du rejet');
            }
        }
    </script>
</body>
</html>
