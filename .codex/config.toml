[mcp_servers.perplexity]
command = "npx"
args = ["-yq", "@perplexity-ai/mcp-server"]
env_vars = ["PERPLEXITY_API_KEY"]
enabled = true
startup_timeout_sec = 30
tool_timeout_sec = 600

[mcp_servers.firecrawl]
url = "https://mcp.firecrawl.dev/v2/mcp"
enabled = true
startup_timeout_sec = 30
tool_timeout_sec = 600
